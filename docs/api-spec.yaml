  /recipes:
    get:
      tags: [Receptai]
      summary: Visų receptų sąrašas
      description: |
        Visų kategorijų receptai viename sąraše (pagrindiniam puslapiui). Filtrai tie patys,
        kaip kategorijos viduje, plius categoryId ir authorId. Filtras, kuris nieko neranda,
        grąžina 200 su tuščiu data, o ne klaidą. Kiekvienas receptas turi ir kategorijos id bei pavadinimą.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: categoryId
          in: query
          description: Tik šios kategorijos receptai
          schema:
            type: integer
            minimum: 1
        - name: authorId
          in: query
          description: Tik šio autoriaus receptai
          schema:
            type: integer
            minimum: 1
        - name: difficulty
          in: query
          description: Sudėtingumas
          schema:
            type: string
            enum: [easy, medium, hard]
        - name: maxTime
          in: query
          description: Didžiausias gaminimo laikas minutėmis (imtinai)
          schema:
            type: integer
            minimum: 1
        - name: search
          in: query
          description: Paieška pagal recepto pavadinimą (be didžiųjų ir mažųjų raidžių skirtumo)
          schema:
            type: string
      responses:
        '200':
          description: Receptų sąrašas (užklausa ?authorId=2&limit=1)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeList' }
              example:
                data:
                  - id: 8
                    categoryId: 4
                    authorId: 2
                    title: Bulviniai blynai
                    description: "Bulves ir svogūną smulkiai sutarkuokite, nusunkite skystį. Įmaišykite kiaušinį, miltus ir druską. Šaukštu dėkite masę į įkaitintą aliejų ir kepkite iš abiejų pusių, kol gražiai apskrus. Patiekite su grietine."
                    ingredients: "1 kg bulvių\n1 svogūnas\n1 kiaušinis\n2 šaukštai miltų\naliejaus kepimui\ndruskos pagal skonį\ngrietinės patiekimui"
                    prepTimeMinutes: 40
                    difficulty: easy
                    servings: 4
                    imageUrl: null
                    createdAt: "2026-10-08T13:28:33.824Z"
                    updatedAt: "2026-10-08T13:28:33.824Z"
                    author: { id: 2, username: jonas }
                    category: { id: 4, name: Vegetariški patiekalai }
                    commentCount: 2
