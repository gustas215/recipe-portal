openapi: 3.0.3
info:
  title: Receptų portalo API
  version: 2.0.0
  description: |
    REST API receptų portalui. Objektų hierarchija: kategorija → receptas → atsiliepimas.

    Visi atsakymai grąžinami JSON formatu, įskaitant klaidas. Klaidos formatas:
    `{ "error": { "status": 404, "message": "...", "details": null } }`.

    Sąrašai puslapiuojami (`page`, `limit`) ir turi hypermedia nuorodas `_links`.

    ## Autentifikacija ir autorizacija

    Naudojami JWT žetonai.

    1. `POST /auth/login` grąžina **access žetoną** (galioja 15 min.). Jį reikia siųsti kiekvienoje apsaugotoje
       užklausoje antraštėje `Authorization: Bearer <žetonas>`. Žetono viduje yra naudotojo ID (`sub`),
       rolė (`role`) ir sesijos ID (`sid`). Žetonas pasirašomas HS256 algoritmu.
    2. Kartu nustatomas `refreshToken` cookie (httpOnly, galioja 7 d., siunčiamas tik adresais `/api/auth/*`).
       Juo `POST /auth/refresh` iškeičia į naują access žetoną. Kiekvienas refresh žetonas galioja tik vieną kartą (rotacija).
    3. `POST /auth/logout` atšaukia sesiją, todėl po atsijungimo nustoja veikti ir dar nepasibaigęs access žetonas.

    Rolės: svečias (be žetono, gali tik skaityti), `user` ir `admin`. Metodai su spynos ikona reikalauja prisijungimo.

    - **401**: nėra žetono, jis negalioja arba sesija atšaukta.
    - **403**: naudotojas prisijungęs, bet neturi teisės (pvz. svetimo recepto keitimas arba administratoriaus metodas).

    Swagger UI: per `POST /auth/login` gaukite `accessToken`, spauskite **Authorize** ir įrašykite jį (be žodžio Bearer).
    Testavimui paruošti naudotojai: `admin@example.com` / `Admin123!` (administratorius) ir `jonas@example.com`,
    `ruta@example.com`, `mantas@example.com` / `Slaptazodis123!` (paprasti naudotojai).
servers:
  - url: http://localhost:3000/api
    description: Vietinė aplinka
tags:
  - name: Autentifikacija
    description: Registracija, prisijungimas, žetonų atnaujinimas ir atsijungimas
  - name: Kategorijos
    description: Receptų kategorijos
  - name: Receptai
    description: Receptai kategorijos viduje ir bendras receptų sąrašas
  - name: Atsiliepimai
    description: Recepto atsiliepimai (komentaras kartu su įvertinimu 1-5)
  - name: Naudotojai
    description: Naudotojų sąrašas, skydelis ir šalinimas

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access žetonas iš POST /auth/login (galioja 15 min.)
  parameters:
    CategoryId:
      name: categoryId
      in: path
      required: true
      description: Kategorijos ID
      schema:
        type: integer
        minimum: 1
        example: 2
    RecipeId:
      name: recipeId
      in: path
      required: true
      description: Recepto ID
      schema:
        type: integer
        minimum: 1
        example: 3
    CommentId:
      name: commentId
      in: path
      required: true
      description: Atsiliepimo ID
      schema:
        type: integer
        minimum: 1
        example: 5
    UserId:
      name: userId
      in: path
      required: true
      description: Naudotojo ID
      schema:
        type: integer
        minimum: 1
        example: 2
    Page:
      name: page
      in: query
      description: Puslapio numeris (nuo 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Įrašų kiekis puslapyje. Numatytasis 10, daugiausia 50 (didesnė reikšmė sumažinama iki 50).
      schema:
        type: integer
        minimum: 1
        default: 10

  schemas:
    Link:
      type: object
      properties:
        href:
          type: string
          example: /api/categories/1
    ListLinks:
      type: object
      description: Puslapiavimo nuorodos. `prev` ir `next` pateikiamos tik tada, kai yra kur eiti.
      properties:
        self: {$ref: '#/components/schemas/Link'}
        first: {$ref: '#/components/schemas/Link'}
        last: {$ref: '#/components/schemas/Link'}
        prev: {$ref: '#/components/schemas/Link'}
        next: {$ref: '#/components/schemas/Link'}
    Pagination:
      type: object
      properties:
        page: {type: integer, example: 1}
        limit: {type: integer, example: 10}
        totalItems: {type: integer, example: 6}
        totalPages: {type: integer, example: 1}
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            status: {type: integer, example: 404}
            message: {type: string}
            details:
              type: array
              nullable: true
              description: Laukų klaidos (409 ir 422 atvejais), kitais atvejais null
              items:
                type: object
                properties:
                  field: {type: string, example: name}
                  message: {type: string}
    UserRef:
      type: object
      description: Trumpa informacija apie autorių
      properties:
        id: {type: integer, example: 2}
        username: {type: string, example: jonas}

    Category:
      type: object
      properties:
        id: {type: integer, example: 1}
        name: {type: string, example: Sriubos}
        description: {type: string}
        imageUrl: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        _links:
          type: object
          properties:
            self: {$ref: '#/components/schemas/Link'}
            collection: {$ref: '#/components/schemas/Link'}
            recipes: {$ref: '#/components/schemas/Link'}
    CategoryInput:
      type: object
      required: [name, description]
      properties:
        name: {type: string, minLength: 2, maxLength: 100, example: Gerimai}
        description:
          type: string
          minLength: 1
          maxLength: 1000
          example: "Arbatos, kompotai ir kiti gerimai."
        imageUrl:
          type: string
          format: uri
          maxLength: 500
          nullable: true
          description: http arba https adresas. Jei nenurodomas, išsaugoma null.
    CategoryList:
      type: object
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Category'}
        pagination: {$ref: '#/components/schemas/Pagination'}
        _links: {$ref: '#/components/schemas/ListLinks'}

    Recipe:
      type: object
      properties:
        id: {type: integer, example: 3}
        categoryId: {type: integer, example: 2}
        authorId: {type: integer, example: 2}
        title: {type: string, example: Cepelinai su mėsa}
        description: {type: string}
        ingredients:
          type: string
          description: Ingredientai, kiekvienas naujoje eilutėje
          example: "2 kg žalių bulvių\n500 g virtų bulvių\n500 g kiaulienos faršo"
        prepTimeMinutes: {type: integer, example: 120}
        difficulty: {type: string, enum: [easy, medium, hard], example: hard}
        servings: {type: integer, example: 6}
        imageUrl: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        author: {$ref: '#/components/schemas/UserRef'}
        category:
          type: object
          description: Pateikiama tik bendrame sąraše GET /recipes
          properties:
            id: {type: integer, example: 2}
            name: {type: string, example: Karšti patiekalai}
        commentCount: {type: integer, example: 2}
        averageRating:
          type: number
          nullable: true
          description: Atsiliepimų įvertinimų vidurkis, null jei atsiliepimų nėra
          example: 4.5
        _links:
          type: object
          properties:
            self: {$ref: '#/components/schemas/Link'}
            collection: {$ref: '#/components/schemas/Link'}
            category: {$ref: '#/components/schemas/Link'}
            comments: {$ref: '#/components/schemas/Link'}
    RecipeInput:
      type: object
      required: [title, description, ingredients, prepTimeMinutes, difficulty, servings]
      properties:
        title: {type: string, minLength: 2, maxLength: 150, example: Sumustiniai su lašiša}
        description: {type: string, minLength: 10, maxLength: 5000}
        ingredients: {type: string, minLength: 3, maxLength: 3000}
        prepTimeMinutes: {type: integer, minimum: 1, maximum: 10000, example: 10}
        difficulty: {type: string, enum: [easy, medium, hard], example: easy}
        servings: {type: integer, minimum: 1, maximum: 100, example: 2}
        imageUrl:
          type: string
          format: uri
          maxLength: 500
          nullable: true
    RecipeList:
      type: object
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Recipe'}
        pagination: {$ref: '#/components/schemas/Pagination'}
        _links: {$ref: '#/components/schemas/ListLinks'}

    Comment:
      type: object
      properties:
        id: {type: integer, example: 5}
        recipeId: {type: integer, example: 3}
        authorId: {type: integer, example: 3}
        text: {type: string}
        rating: {type: integer, minimum: 1, maximum: 5, example: 5}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        author: {$ref: '#/components/schemas/UserRef'}
        _links:
          type: object
          properties:
            self: {$ref: '#/components/schemas/Link'}
            collection: {$ref: '#/components/schemas/Link'}
            recipe: {$ref: '#/components/schemas/Link'}
    CommentInput:
      type: object
      required: [text, rating]
      properties:
        text: {type: string, minLength: 3, maxLength: 2000}
        rating: {type: integer, minimum: 1, maximum: 5, example: 4}
    CommentList:
      type: object
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Comment'}
        pagination: {$ref: '#/components/schemas/Pagination'}
        _links: {$ref: '#/components/schemas/ListLinks'}

    User:
      type: object
      description: Naudotojas. Slaptažodžio hash niekada negrąžinamas.
      properties:
        id: {type: integer, example: 2}
        username: {type: string, example: jonas}
        email: {type: string, example: jonas@example.com}
        role: {type: string, enum: [user, admin], example: user}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        _links:
          type: object
          properties:
            collection: {$ref: '#/components/schemas/Link'}
            dashboard: {$ref: '#/components/schemas/Link'}
            recipes: {$ref: '#/components/schemas/Link'}
    UserList:
      type: object
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/User'}
        pagination: {$ref: '#/components/schemas/Pagination'}
        _links: {$ref: '#/components/schemas/ListLinks'}
    Dashboard:
      type: object
      description: Resursas, sudarytas iš trijų esybių (naudotojas, jo receptai, jo receptų gauti atsiliepimai)
      properties:
        user: {$ref: '#/components/schemas/User'}
        stats:
          type: object
          properties:
            recipeCount: {type: integer, example: 3}
            receivedCommentCount: {type: integer, example: 6}
            averageRating: {type: number, nullable: true, example: 4.5}
        recipes:
          type: array
          items: {$ref: '#/components/schemas/Recipe'}
        receivedComments:
          type: array
          description: Tik 10 naujausių atsiliepimų, bendras kiekis yra stats.receivedCommentCount
          items: {$ref: '#/components/schemas/Comment'}
        _links:
          type: object
          properties:
            self: {$ref: '#/components/schemas/Link'}
            recipes: {$ref: '#/components/schemas/Link'}
    RegisterInput:
      type: object
      required: [username, email, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 50, example: petras}
        email: {type: string, format: email, maxLength: 255, example: petras@example.com}
        password:
          type: string
          minLength: 8
          maxLength: 72
          example: Slaptazodis123!
          description: Saugomas tik bcrypt hash. Rolė visada user, jos nurodyti negalima (papildomi laukai ignoruojami).
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: {type: string, example: jonas@example.com}
        password: {type: string, example: Slaptazodis123!}
    AuthUser:
      type: object
      properties:
        id: {type: integer, example: 5}
        username: {type: string, example: petras}
        email: {type: string, example: petras@example.com}
        role: {type: string, enum: [user, admin], example: user}
        createdAt: {type: string, format: date-time}
    RegisteredUser:
      allOf:
        - $ref: '#/components/schemas/AuthUser'
        - type: object
          properties:
            _links:
              type: object
              properties:
                self: {$ref: '#/components/schemas/Link'}
                login: {$ref: '#/components/schemas/Link'}
    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/AuthUser'
        - type: object
          properties:
            _links:
              type: object
              properties:
                self: {$ref: '#/components/schemas/Link'}
                dashboard: {$ref: '#/components/schemas/Link'}
                logout: {$ref: '#/components/schemas/Link'}
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT (HS256). Turinyje yra sub (naudotojo ID), role, sid (sesijos ID), iat ir exp.
        tokenType: {type: string, example: Bearer}
        expiresIn: {type: integer, description: Access žetono galiojimas sekundėmis, example: 900}
        user: {$ref: '#/components/schemas/AuthUser'}

  responses:
    BadRequest:
      description: Netinkamas ID, netinkamas užklausos parametras arba sugadintas JSON
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              status: 400
              message: "Netinkamas categoryId: turi būti teigiamas sveikasis skaičius"
              details:
    Unprocessable:
      description: JSON teisingas, bet laukų reikšmės netinkamos. Klaidos išvardytos details lauke.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              status: 422
              message: Neteisingi duomenys
              details:
                - field: name
                  message: Pavadinimas turi būti bent 2 simbolių
                - field: description
                  message: Aprašymas privalomas
    CategoryNotFound:
      description: Kategorija nerasta
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              status: 404
              message: Kategorija nerasta
              details:
    RecipeNotFound:
      description: Kategorija nerasta arba receptas nepriklauso šiai kategorijai
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              status: 404
              message: Receptas nerastas šioje kategorijoje
              details:
    CommentNotFound:
      description: Kategorija ar receptas nerasti arba atsiliepimas nepriklauso šiam receptui
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              status: 404
              message: Atsiliepimas nerastas šiame recepte
              details:
    UserNotFound:
      description: Naudotojas nerastas
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              status: 404
              message: Naudotojas nerastas
              details:

    Unauthorized:
      description: Nėra access žetono, jis sugadintas, pasibaigęs arba sesija atšaukta (atsijungus)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            noToken:
              summary: Nėra Authorization antraštės
              value:
                error:
                  status: 401
                  message: Reikalingas prisijungimas
                  details:
            invalidToken:
              summary: Žetonas sugadintas arba pasibaigęs
              value:
                error:
                  status: 401
                  message: Žetonas negalioja arba pasibaigė
                  details:
            sessionEnded:
              summary: Sesija atšaukta (atsijungta arba žetonas pakeistas per refresh)
              value:
                error:
                  status: 401
                  message: Sesija nebegalioja
                  details:
    ForbiddenAdmin:
      description: Prisijungęs naudotojas nėra administratorius
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              status: 403
              message: Neturite teisių atlikti šio veiksmo
              details:
    ForbiddenOwner:
      description: Šį turinį sukūrė kitas naudotojas. Keisti gali tik autorius (administratorius taip pat negali)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              status: 403
              message: Šį veiksmą gali atlikti tik turinio autorius
              details:
    ForbiddenOwnerOrAdmin:
      description: Šį turinį sukūrė kitas naudotojas. Šalinti gali tik autorius arba administratorius
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              status: 403
              message: Šį veiksmą gali atlikti tik turinio autorius arba administratorius
              details:
    ForbiddenSelfOrAdmin:
      description: Skydelį mato tik pats naudotojas arba administratorius
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              status: 403
              message: Šį veiksmą gali atlikti tik pats naudotojas arba administratorius
              details:
paths:
  /auth/register:
    post:
      tags: [Autentifikacija]
      summary: Registruotis
      description: |
        Sukuria naują naudotoją su role user. Slaptažodis saugomas kaip bcrypt hash. Nurodyti rolės negalima:
        papildomi laukai (pvz. role) ignoruojami, administratorių galima sukurti tik tiesiogiai duomenų bazėje.
        Registracija neprijungia, po jos reikia kviesti POST /auth/login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterInput'}
            example:
              username: petras
              email: petras@example.com
              password: Slaptazodis123!
      responses:
        '201':
          description: Naudotojas sukurtas (slaptažodžio hash negrąžinamas)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegisteredUser'}
              example:
                id: 5
                username: petras
                email: petras@example.com
                role: user
                createdAt: "2026-10-09T14:49:28.840Z"
                _links:
                  self: {href: /api/auth/register}
                  login: {href: /api/auth/login}
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Toks naudotojo vardas arba el. paštas jau užregistruotas
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  status: 409
                  message: Tokia reikšmė jau naudojama
                  details:
                    - field: email
                      message: email must be unique
        '422':
          description: Netinkami laukai
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  status: 422
                  message: Neteisingi duomenys
                  details:
                    - field: username
                      message: Naudotojo vardas turi būti bent 3 simbolių
                    - field: email
                      message: Neteisingas el. pašto formatas
                    - field: password
                      message: Slaptažodis turi būti bent 8 simbolių
  /auth/login:
    post:
      tags: [Autentifikacija]
      summary: Prisijungti
      description: |
        Patikrina el. paštą ir slaptažodį. Sėkmės atveju sukuria sesiją, atsakyme grąžina access žetoną (15 min.),
        o refresh žetoną nustato httpOnly cookie refreshToken (7 d., Path=/api/auth). Blogas el. paštas ir blogas
        slaptažodis grąžina tą pačią žinutę, kad nebūtų galima išsiaiškinti, kurie el. paštai užregistruoti.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginInput'}
            example:
              email: jonas@example.com
              password: Slaptazodis123!
      responses:
        '200':
          description: Prisijungta
          headers:
            Set-Cookie:
              description: refreshToken=...; Path=/api/auth; HttpOnly; Max-Age=604800 (gamyboje dar Secure ir SameSite=None)
              schema:
                type: string
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIyIiwicm9sZSI6InVzZXIiLCJzaWQiOjEsImlhdCI6MTc5MTU1NzM2OSwiZXhwIjoxNzkxNTU4MjY5fQ.N5voPm3WeL8MaZ57zxIkqbGYX9_E7eqfjITRM73gtfw
                tokenType: Bearer
                expiresIn: 900
                user:
                  id: 2
                  username: jonas
                  email: jonas@example.com
                  role: user
                  createdAt: "2026-10-09T14:49:19.595Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Neteisingas el. paštas arba slaptažodis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  status: 401
                  message: Neteisingas el. paštas arba slaptažodis
                  details:
        '422':
          description: Trūksta el. pašto arba slaptažodžio
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  status: 422
                  message: Neteisingi duomenys
                  details:
                    - field: email
                      message: El. paštas privalomas
                    - field: password
                      message: Slaptažodis privalomas
  /auth/refresh:
    post:
      tags: [Autentifikacija]
      summary: Atnaujinti access žetoną
      description: |
        Iškeičia refresh žetoną (cookie refreshToken, naršyklė jį siunčia pati) į naują access žetoną.
        Rotacija: senoji sesija atšaukiama, sukuriama nauja ir nustatomas naujas refresh cookie. Senas access žetonas
        po to nebegalioja (401), todėl klientas turi pakeisti jį nauju. Kūno nereikia.
      security: []
      parameters:
        - name: refreshToken
          in: cookie
          required: false
          description: Refresh žetonas. Siunčiamas automatiškai, jei naršyklė jį turi.
          schema:
            type: string
      responses:
        '200':
          description: Naujas access žetonas ir naujas refresh cookie
          headers:
            Set-Cookie:
              description: Naujas refreshToken cookie
              schema:
                type: string
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIyIiwicm9sZSI6InVzZXIiLCJzaWQiOjIsImlhdCI6MTc5MTU1NzQ2OSwiZXhwIjoxNzkxNTU4MzY5fQ.kQ1x0m3b9Zr8vJmP2sT7yUeWnL4cHdA6fGiOaVbXyEs
                tokenType: Bearer
                expiresIn: 900
                user:
                  id: 2
                  username: jonas
                  email: jonas@example.com
                  role: user
                  createdAt: "2026-10-09T14:49:19.595Z"
        '401':
